---
- name: Update pi
  hosts: all
  become: true
  serial: 1
  any_errors_fatal: true
  vars:
    # unbound_* defaults also cover molecule side_effect inventories.
    unbound_container_name: unbound
    unbound_port: 5335
    unbound_network_name: dns_net
    pihole_update_health_qname: >-
      {{ pihole_verify_qname | default(pihole_unbound_verify_qname | default('cloudflare.com')) }}
  pre_tasks:
    - name: Collect peer DNS addresses before drain
      tags: [drain, ha, keepalived]
      ansible.builtin.set_fact:
        pihole_update_peer_dns_hosts: >-
          {{
            groups['all']
            | reject('equalto', inventory_hostname)
            | map('extract', hostvars, 'ansible_host')
            | select('defined')
            | list
          }}

    - name: Probe peer DNS listeners before drain
      tags: [drain, ha, keepalived]
      ansible.builtin.wait_for:
        host: "{{ item }}"
        port: 53
        timeout: 5
        state: started
      loop: "{{ pihole_update_peer_dns_hosts }}"
      register: pihole_update_peer_dns
      ignore_errors: true
      changed_when: false
      when:
        - not ansible_check_mode
        - pihole_update_peer_dns_hosts | length > 0

    - name: Refuse to drain the last healthy DNS node
      tags: [drain, ha, keepalived]
      ansible.builtin.assert:
        that:
          - pihole_update_peer_dns.results | rejectattr('failed') | list | length > 0
        fail_msg: >-
          Refusing to drain {{ inventory_hostname }}: no other inventory
          ansible_host answered TCP/53. Repair the peer before draining
          the last healthy DNS node.
      when:
        - not ansible_check_mode
        - pihole_update_peer_dns_hosts | length > 0
  roles:
    - role: steveyminecraft.pihole.stop_keepalived
      tags: [stopkeepalived, drain, ha]
    - role: steveyminecraft.pihole.stop_containers
      tags: [stopcontainers, drain, container]
    - role: steveyminecraft.pihole.updates
      tags: [updates, system]
    - role: steveyminecraft.pihole.unbound
      tags: [unbound, dns]
      when:
        - not ansible_check_mode
        - pihole_enable_unbound | default(true) | bool
    - role: steveyminecraft.pihole.traefik
      tags: [traefik, proxy]
      when: not ansible_check_mode
    - role: steveyminecraft.pihole.pihole
      tags: [pihole, dns]
      when: not ansible_check_mode
  post_tasks:
    - name: Validate node DNS before resuming keepalived
      tags: [pihole, dns, ha, keepalived]
      when: not ansible_check_mode
      block:
        - name: Wait for local Pi-hole DNS listener
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: 53
            timeout: 180
            delay: 2

        - name: Verify local Pi-hole DNS resolves health qname
          ansible.builtin.command:
            argv:
              - dig
              - +short
              - "@127.0.0.1"
              - "{{ pihole_update_health_qname }}"
          register: pihole_update_local_dns
          changed_when: false
          failed_when: >
            (pihole_update_local_dns.stdout_lines
             | select('match', '^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$')
             | list | length) == 0

        - name: Verify local Unbound DNS when deployed
          # Resolve Docker DNS names via 127.0.0.11 when pihole_docker_dns
          # overrides container resolv.conf away from the embedded resolver.
          ansible.builtin.command:
            argv:
              - docker
              - exec
              - "{{ pihole_container_name | default('pihole') }}"
              - sh
              - -lc
              - >-
                t='{{ pihole_unbound_dns_target | default(unbound_container_name | default('unbound')) }}';
                case "$t" in
                  [0-9]*.[0-9]*.[0-9]*.[0-9]*) ;;
                  *) t=$(dig +short "$t" @127.0.0.11 +tries=2 +time=3 | awk '/^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$/{print; exit}');;
                esac;
                test -n "$t" || exit 1;
                dig +short @"$t" -p {{ unbound_port | default(5335) | string }} {{ pihole_update_health_qname }}
          register: pihole_update_unbound_dns
          changed_when: false
          failed_when: >
            (pihole_update_unbound_dns.stdout_lines
             | select('match', '^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$')
             | list | length) == 0
          when: pihole_unbound_present | default(false) | bool

      rescue:
        - name: Stop update because node failed DNS validation while drained
          ansible.builtin.fail:
            msg: >-
              {{ inventory_hostname }} failed post-update DNS validation.
              Keepalived has not been resumed on this node. Repair the node
              and verify DNS before returning it to VIP service.

    # Runs in check mode too so --check --diff shows keepalived drift.
    - name: Render keepalived after local DNS validation
      tags: [keepalived, ha]
      when: pihole_ha_mode | default(false) | bool
      block:
        - name: Render and validate keepalived configuration
          ansible.builtin.import_role:
            name: steveyminecraft.pihole.keepalived
            tasks_from: render.yml

      rescue:
        - name: Stop update because keepalived configuration failed to render
          ansible.builtin.fail:
            msg: >-
              {{ inventory_hostname }} could not render or validate
              keepalived.conf. The previous config is unchanged and
              keepalived has not been resumed on this node.

    - name: Restart keepalived only if its rendered config changed
      tags: [keepalived, ha]
      ansible.builtin.meta: flush_handlers

    - name: Resume keepalived after local DNS validation
      tags: [keepalived, ha]
      when: not ansible_check_mode
      ansible.builtin.import_role:
        name: steveyminecraft.pihole.start_keepalived

- name: Verify HA DNS after update
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Verify VIP DNS resolves health qname after update
      ansible.builtin.command:
        argv:
          - dig
          - +short
          - "@{{ (pihole_vip_ipv4 | split('/'))[0] }}"
          - >-
            {{
              pihole_update_health_qname
              | default(pihole_verify_qname | default(pihole_unbound_verify_qname | default('cloudflare.com')))
            }}
      register: pihole_update_vip_dns
      changed_when: false
      check_mode: false
      retries: 30
      delay: 2
      until: >
        (pihole_update_vip_dns.stdout_lines
         | select('match', '^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$')
         | list | length) > 0
      run_once: true
      when:
        - pihole_ha_mode | default(false) | bool
        - pihole_vip_ipv4 is defined
      tags: [pihole, dns, ha, keepalived]
