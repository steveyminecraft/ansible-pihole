namespace: steveyminecraft
name: pihole
version: 1.9.1
readme: README.md
authors:
  - steveyminecraft
description: >-
  Deploy Pi-hole with Docker, optional Unbound, optional Traefik, keepalived HA,
  and Nebula Sync. Supported on Ubuntu, Debian, and Raspberry Pi OS. Rocky Linux
  and Red Hat Enterprise Linux are deprecated (existing EL task paths remain).
  Includes playbooks for bootstrap, updates, and configuration sync.
license:
  - Apache-2.0
tags:
  - pihole
  - docker
  - traefik
  - dns
  - ha
  - keepalived
  - unbound
  - ansible
repository: https://github.com/steveyminecraft/ansible-pihole
documentation: https://github.com/steveyminecraft/ansible-pihole#readme
homepage: https://github.com/steveyminecraft/ansible-pihole
issues: https://github.com/steveyminecraft/ansible-pihole/issues
build_ignore:
  - .ansible
  - .ansible/**
  - .cache
  - .cache/**
  - .cursor
  - .cursor/**
  - .git
  - .git/**
  - .github
  - .github/**
  - .mypy_cache
  - .mypy_cache/**
  - .pytest_cache
  - .pytest_cache/**
  - .venv
  - .venv/**
  - .venv-*
  - .vagrant
  - .vagrant/**
  - '**/.vagrant'
  - '**/.vagrant/**'
  - .cursor_automerge_watch.sh
  - .env
  - .env.*
  - env
  - env/**
  - importer_result.json
  - scripts/setup-env.sh
  - steveyminecraft-pihole-*.tar.gz
dependencies:
  ansible.posix: '>=2.2.0'
  community.docker: '>=3.10.0'
  community.crypto: '>=2.20.0'
  community.general: '>=9.0.0'
