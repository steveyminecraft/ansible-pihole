---
all:
  hosts:
    lab-pihole-01:
      ansible_host: 192.0.2.10
      priority: 110
      keepalive_role: MASTER
  vars:
    ansible_user: ansible
    ansible_python_interpreter: /usr/bin/python3
    ansible_user_home_dir: /home/ansible
    pihole_compose_dir: /opt/pihole
    github_user_for_ssh_key: replace-me
    password_lock: true
    timezone: Etc/UTC
    pihole_enable_unbound: true
    pihole_ha_mode: false
    traefik_enabled: true
    traefik_domain: home.example.com
    traefik_acme_email: admin@example.com
    traefik_acme_dns_provider: cloudflare
    traefik_acme_environment:
      CLOUDFLARE_DNS_API_TOKEN: REPLACE_WITH_ANSIBLE_VAULT
    pihole_environment_variables:
      TZ: Etc/UTC
      FTLCONF_webserver_api_password: REPLACE_WITH_ANSIBLE_VAULT
      FTLCONF_dns_listeningMode: all
      DHCP_ACTIVE: false
      REV_SERVER: false
