---
# Developer hook uses the current ansible-core line; CI also validates the 2.20.5 floor.
repos:
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args:
          - -c
          - .yamllint

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.10.1
    hooks:
      - id: ansible-lint
        args:
          - -p
          - roles
          - playbooks
          - molecule
        always_run: true
        pass_filenames: false
        additional_dependencies:
          - ansible-core==2.22.0
        env:
          ANSIBLE_CONFIG: ansible.cfg
