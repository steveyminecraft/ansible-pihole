---
# Releases and tags are only produced from the master branch.
# Typical flow: merge topic PRs to master (opens/updates a Release PR) →
# RC tag vX.Y.Z-rc.N is pushed automatically → AWS ephemeral tests run →
# merge Release PR → tag v*.*.*, GitHub release, Galaxy publish.
# No workflow_dispatch or tag-push triggers (see removed release.yml).
name: Release

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-please-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release please
    if: >-
      github.repository_owner == 'steveyminecraft'
      && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prs_created: ${{ steps.release.outputs.prs_created }}

    steps:
      - name: Select GitHub token
        id: release-token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GITHUB_TOKEN_FALLBACK: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          token="${RELEASE_PLEASE_TOKEN:-}"
          status_code="000"
          if [ -n "${token}" ]; then
            status_code="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}" || echo '000')"
          fi

          if [ -n "${token}" ] && [ "${status_code}" = "200" ]; then
            echo "Using RELEASE_PLEASE_TOKEN."
          elif [ -z "${token}" ] || [ "${status_code}" = "401" ] || [ "${status_code}" = "403" ]; then
            if [ -n "${token}" ]; then
              echo "::warning::RELEASE_PLEASE_TOKEN is invalid; using github.token fallback."
            else
              echo "::warning::RELEASE_PLEASE_TOKEN is not set; using github.token fallback."
            fi
            token="${GITHUB_TOKEN_FALLBACK}"
          else
            echo "::warning::Token validation inconclusive (HTTP ${status_code}); using RELEASE_PLEASE_TOKEN."
          fi
          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.release-token.outputs.token }}

  rerun-blocked-release-pr-checks:
    name: Rerun blocked release PR workflows
    needs: release-please
    if: >-
      github.repository_owner == 'steveyminecraft'
      && github.ref == 'refs/heads/master'
      && needs.release-please.result == 'success'
      && needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Rerun workflows awaiting approval on release PR head
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_BRANCH: release-please--branches--master
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::RELEASE_PLEASE_TOKEN is not set; cannot auto-run blocked release PR workflows."
            echo "Set RELEASE_PLEASE_TOKEN so release-please opens PRs with a maintainer PAT instead of GITHUB_TOKEN."
            exit 0
          fi

          # CI workflows on the release PR may still be created after this job starts.
          sleep 15

          head_sha="$(gh api "repos/${REPO}/git/ref/heads/${RELEASE_BRANCH}" --jq .object.sha)"
          echo "Release PR head: ${head_sha}"

          mapfile -t run_ids < <(
            gh api "repos/${REPO}/actions/runs?head_sha=${head_sha}&per_page=100" \
              --jq '.workflow_runs[] | select(.conclusion == "action_required") | .id'
          )

          if [ "${#run_ids[@]}" -eq 0 ]; then
            echo "No action_required workflow runs for ${head_sha}."
            exit 0
          fi

          for run_id in "${run_ids[@]}"; do
            echo "Rerunning workflow run ${run_id}."
            gh api -X POST "repos/${REPO}/actions/runs/${run_id}/rerun" || true
          done

  tag-release-candidate:
    name: Tag release candidate for AWS tests
    needs: release-please
    if: >-
      github.repository_owner == 'steveyminecraft'
      && github.ref == 'refs/heads/master'
      && needs.release-please.outputs.prs_created == 'true'
      && needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Validate release token for RC tagging
        id: rc-token
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::RELEASE_PLEASE_TOKEN is not available; skipping RC tag and AWS RC tests."
            echo "available=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "available=true" >> "${GITHUB_OUTPUT}"

      - name: Check out release PR branch
        if: steps.rc-token.outputs.available == 'true'
        uses: actions/checkout@v7
        with:
          ref: release-please--branches--master
          fetch-depth: 0

      - name: Create and push RC tag
        if: steps.rc-token.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN is required to push RC tags."
            exit 1
          fi

          version="$(python3 -c "import json; print(json.load(open('.release-please-manifest.json'))['.'])")"
          base_tag="v${version}"
          head_sha="$(git rev-parse HEAD)"

          existing_for_commit="$(git tag -l "${base_tag}-rc.*" --points-at "${head_sha}" | paste -sd ',' - || true)"
          if [ -n "${existing_for_commit}" ]; then
            echo "RC tag already exists for ${head_sha}: ${existing_for_commit}"
            exit 0
          fi

          latest_rc=0
          while IFS= read -r tag; do
            suffix="${tag#${base_tag}-rc.}"
            if [[ "${suffix}" =~ ^[0-9]+$ ]] && (( suffix > latest_rc )); then
              latest_rc="${suffix}"
            fi
          done < <(git tag -l "${base_tag}-rc.*")

          rc_tag="${base_tag}-rc.$((latest_rc + 1))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${rc_tag}" -m "Release candidate for ${base_tag} (release PR ${head_sha::7})" "${head_sha}"
          git push origin "${rc_tag}"
          echo "Pushed ${rc_tag}; CI — Pi-hole: AWS EC2 (RC) will start automatically."

  publish-galaxy:
    name: Publish collection to Ansible Galaxy
    needs: release-please
    if: >-
      needs.release-please.outputs.release_created == 'true'
      && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Build and publish steveyminecraft.pihole
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        run: |
          python -m pip install --upgrade pip 'ansible-core>=2.21.2,<2.22'
          ansible-galaxy collection build
          if [ -z "${GALAXY_API_KEY:-}" ]; then
            echo "GALAXY_API_KEY is not set; skipping Galaxy publish."
            exit 0
          fi
          artifact="$(ls -1 steveyminecraft-pihole-*.tar.gz | head -1)"
          echo "Publishing ${artifact} for tag ${{ needs.release-please.outputs.tag_name }}"
          ansible-galaxy collection publish "${artifact}" --api-key "${GALAXY_API_KEY}"
