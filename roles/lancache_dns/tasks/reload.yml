---
# Pi-hole v6 has no restartdns. reloaddns does not re-read /etc/dnsmasq.d.
# Restart the existing container (same ID) so FTL reloads conf-dir. Do not
# compose recreate. Do not signal PID 1.
- name: Restart the existing Pi-hole container to reload dnsmasq.d
  ansible.builtin.command:
    argv:
      - docker
      - restart
      - "{{ lancache_dns_container_name }}"
  register: lancache_dns_reload_cmd
  changed_when: true

- name: Wait for Pi-hole DNS after container restart
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 53
    timeout: 60
    state: started

- name: Prove Steam CDN now answers with the cache IPv4
  ansible.builtin.command:
    argv:
      - dig
      - +short
      - +time=2
      - +tries=1
      - "@127.0.0.1"
      - "{{ lancache_dns_verify_qname }}"
      - A
  register: lancache_dns_verify_dig
  until: lancache_dns_cache_ipv4 in (lancache_dns_verify_dig.stdout | default(''))
  retries: 10
  delay: 2
  changed_when: false
  when: lancache_dns_command == 'apply'

- name: Prove Steam CDN has no AAAA (LAN is IPv4-only)
  ansible.builtin.command:
    argv:
      - dig
      - +short
      - +time=2
      - +tries=1
      - "@127.0.0.1"
      - "{{ lancache_dns_verify_qname }}"
      - AAAA
  register: lancache_dns_verify_aaaa
  until: >-
    lancache_dns_verify_aaaa.rc == 0
    and (lancache_dns_verify_aaaa.stdout | default('') | trim) == ''
  retries: 10
  delay: 2
  changed_when: false
  failed_when: >-
    lancache_dns_verify_aaaa.rc != 0
    or (lancache_dns_verify_aaaa.stdout | default('') | trim) != ''
  when: lancache_dns_command == 'apply'

- name: Prove Steam CDN is no longer the cache IPv4 after fail-open
  ansible.builtin.command:
    argv:
      - dig
      - +short
      - +time=2
      - +tries=1
      - "@127.0.0.1"
      - "{{ lancache_dns_verify_qname }}"
      - A
  register: lancache_dns_fail_open_dig
  until: >-
    lancache_dns_fail_open_dig.rc == 0
    and lancache_dns_cache_ipv4 not in (lancache_dns_fail_open_dig.stdout | default(''))
  retries: 10
  delay: 2
  changed_when: false
  failed_when: >-
    lancache_dns_fail_open_dig.rc != 0
    or lancache_dns_cache_ipv4 in (lancache_dns_fail_open_dig.stdout | default(''))
  when: lancache_dns_command == 'fail_open'
