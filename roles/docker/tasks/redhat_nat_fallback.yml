---
# With "iptables": false Docker does not add MASQUERADE. Discover each bridge IPv4 subnet
# (docker network inspect JSON) and add matching masquerade rules.
#
# On EL9+ with iptables-nf_tables, `iptables -j MASQUERADE` often fails (xt_MASQUERADE absent);
# use a dedicated nftables table instead. No firewall-cmd --reload.
- name: Ensure nftables is installed for NAT fallback
  ansible.builtin.package:
    name: nftables
    state: present

# One-line python avoids Docker Go `{{...}}` (Jinja conflict).
- name: Discover Docker IPv4 subnets (dynamic)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      if ! command -v docker >/dev/null 2>&1; then
        exit 0
      fi
      declare -A seen=()
      while read -r id; do
        [ -z "${id:-}" ] && continue
        while IFS= read -r cidr; do
          [ -z "${cidr:-}" ] && continue
          [[ "$cidr" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/[0-9]+$ ]] || continue
          seen["$cidr"]=1
        done < <(
          timeout 60s docker network inspect "$id" 2>/dev/null | python3 -c "$(
            printf '%s\n' \
              'import json' \
              'import sys' \
              '' \
              'raw = sys.stdin.read()' \
              'data = json.loads(raw) if raw.strip() else []' \
              'for n in data:' \
              '  ipam = n.get(\"IPAM\") or {}' \
              '  for c in (ipam.get(\"Config\") or []):' \
              '    if c.get(\"Subnet\"):' \
              '      print(c[\"Subnet\"])'
          )" 2>/dev/null || true
        )
      done < <(timeout 60s docker network ls -q 2>/dev/null || true)
      for k in "${!seen[@]}"; do
        printf '%s\n' "$k"
      done | sort -u
    executable: /bin/bash
  register: _docker_nat_subnets
  changed_when: false
  failed_when: false

- name: Compute NAT fallback subnet list
  ansible.builtin.set_fact:
    docker_nat_fallback_subnets: >-
      {{
        (
          (_docker_nat_subnets.stdout_lines | default([]))
          | map('trim')
          | select('match', '^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+/[0-9]+$')
          | list
          + ['172.16.0.0/12']
        )
        | unique
      }}

- name: Apply Docker bridge egress NAT (nftables masquerade)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      for m in nf_conntrack nf_nat nft_chain_nat nft_nat nft_masq; do
        modprobe "$m" 2>/dev/null || true
      done
      if ! command -v nft >/dev/null 2>&1; then
        echo "nft not found; install nftables" >&2
        exit 1
      fi
      timeout 20s nft delete table ip ansible_docker_nat 2>/dev/null || true
      timeout 20s nft add table ip ansible_docker_nat
      timeout 20s nft add chain ip ansible_docker_nat postrouting '{ type nat hook postrouting priority 100; policy accept; }'
      timeout 20s nft delete table ip ansible_docker_filter 2>/dev/null || true
      timeout 20s nft add table ip ansible_docker_filter
      timeout 20s nft add chain ip ansible_docker_filter forward '{ type filter hook forward priority -150; policy accept; }'
      iptables -P FORWARD ACCEPT 2>/dev/null || true
      echo CHANGED
    executable: /bin/bash
  register: _docker_nat_nft
  changed_when: "'CHANGED' in (_docker_nat_nft.stdout | default(''))"

- name: Add nftables masquerade rules per Docker subnet
  ansible.builtin.command:
    argv:
      - timeout
      - "20s"
      - nft
      - add
      - rule
      - ip
      - ansible_docker_nat
      - postrouting
      - ip
      - saddr
      - "{{ item }}"
      - ip
      - daddr
      - "!="
      - "{{ item }}"
      - masquerade
  register: _docker_nat_rules
  changed_when: true
  loop: "{{ docker_nat_fallback_subnets }}"

- name: Allow forwarded traffic from Docker subnets
  ansible.builtin.command:
    argv:
      - timeout
      - "20s"
      - nft
      - add
      - rule
      - ip
      - ansible_docker_filter
      - forward
      - ip
      - saddr
      - "{{ item }}"
      - accept
  changed_when: true
  loop: "{{ docker_nat_fallback_subnets }}"

- name: Allow forwarded traffic to Docker subnets
  ansible.builtin.command:
    argv:
      - timeout
      - "20s"
      - nft
      - add
      - rule
      - ip
      - ansible_docker_filter
      - forward
      - ip
      - daddr
      - "{{ item }}"
      - accept
  changed_when: true
  loop: "{{ docker_nat_fallback_subnets }}"

- name: Check whether firewalld is running
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --state
  register: _docker_firewalld_state
  changed_when: false
  failed_when: false

- name: Trust Docker subnets in firewalld
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - --zone=trusted
      - --add-source={{ item }}
  loop: "{{ docker_nat_fallback_subnets }}"
  register: _docker_firewalld_source
  changed_when: "'success' in (_docker_firewalld_source.stdout | default(''))"
  failed_when: false
  when: (_docker_firewalld_state.stdout | default('')) == 'running'

- name: Enable firewalld masquerade on public zone
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - --zone=public
      - --add-masquerade
  register: _docker_firewalld_masq
  changed_when: "'success' in (_docker_firewalld_masq.stdout | default(''))"
  failed_when: false
  when: (_docker_firewalld_state.stdout | default('')) == 'running'

- name: Reload firewalld after Docker trust
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --reload
  changed_when: true
  failed_when: false
  when:
    - (_docker_firewalld_state.stdout | default('')) == 'running'
    - (_docker_firewalld_source is changed) or (_docker_firewalld_masq is changed)
