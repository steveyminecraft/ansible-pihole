---
- name: Enable nonlocal IP binding
  ansible.posix.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: '1'
    state: present
    reload: true

- name: Enable IP forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    reload: true
  when: keepalived_enable_ip_forward | default(false) | bool

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
  when: not (keepalived_defer_service_restart | default(false) | bool)

- name: Install keepalived Debian
  ansible.builtin.apt:
    pkg:
      - keepalived
    force_apt_get: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Install keepalived Rocky
  ansible.builtin.dnf:
    name:
      - kernel-headers
      - kernel-devel
      - keepalived
      - policycoreutils-python-utils
      - python3-pip
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Ensure Alpine community repository is present
  ansible.builtin.lineinfile:
    path: /etc/apk/repositories
    line: >-
      https://dl-cdn.alpinelinux.org/alpine/v{{
        ansible_facts['distribution_version'].split('.')[:2] | join('.')
      }}/community
    state: present
    mode: "0644"
  when: ansible_facts['os_family'] == 'Alpine'

- name: Install keepalived Alpine
  community.general.apk:
    name:
      - keepalived
      - shadow-login
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == 'Alpine'

- name: Configure keepalived_t permissive compatibility mode
  community.general.selinux_permissive:
    name: keepalived_t
    permissive: "{{ keepalived_selinux_permissive | default(false) | bool }}"
  when: ansible_facts['os_family'] == 'RedHat'

# Belt-and-suspenders: community.general.selinux_permissive can report ok without
# keepalived_t actually becoming permissive on some Rocky 10 images; semanage is
# authoritative for the lab escape hatch (required so check_pihole.sh can use docker).
- name: Ensure keepalived_t is permissive via semanage (lab escape hatch)
  ansible.builtin.command:
    argv:
      - semanage
      - permissive
      - -a
      - keepalived_t
  register: _keepalived_semanage_permissive
  changed_when: _keepalived_semanage_permissive.rc == 0
  failed_when: >-
    _keepalived_semanage_permissive.rc != 0
    and ('already' not in (_keepalived_semanage_permissive.stderr | default('')))
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - keepalived_selinux_permissive | default(false) | bool

# Since yum doesn't like using notify because yum we have to this instead
- name: Start service keepalived started, if not started
  ansible.builtin.service:
    name: keepalived
    state: stopped
    enabled: true
  when: ansible_facts['os_family'] == 'RedHat'

- name: Keep keepalived drained while service restart is deferred
  ansible.builtin.service:
    name: keepalived
    state: stopped
    enabled: true
  when: keepalived_defer_service_restart | default(false) | bool

- name: Render keepalived configuration and health check
  ansible.builtin.import_tasks: render.yml

### Add in firewall rules for vrrp protocol (proto 112; unicast + multicast)
# firewalld 2.4 on Alpine rejects the name "vrrp" (INVALID_PROTOCOL) and accepts 112.
- name: Ensure firewalld is answering (Alpine)
  ansible.builtin.shell: |
    set -euo pipefail
    if firewall-cmd --state 2>/dev/null | grep -qx running; then
      printf '%s\n' already-running
      exit 0
    fi
    rc-service dbus start
    rc-service firewalld zap || true
    rc-service firewalld start
    firewall-cmd --state
    printf '%s\n' started
  args:
    executable: /bin/bash
  register: alpine_firewalld_ready
  changed_when: alpine_firewalld_ready.stdout_lines[-1] == 'started'
  when: ansible_facts['os_family'] == 'Alpine'

- name: Add VRRP protocol to firewall
  ansible.posix.firewalld:
    rich_rule: >-
      {{
        'rule protocol value="112" accept'
        if ansible_facts['os_family'] == 'Alpine'
        else 'rule protocol value="vrrp" accept'
      }}
    permanent: true
    state: enabled
    immediate: true
  notify: Restart firewall config

- name: Allow VRRP unicast from keepalived peers
  ansible.posix.firewalld:
    rich_rule: >-
      {{
        'rule family=ipv4 source address=' ~ item ~ ' protocol value="112" accept'
        if ansible_facts['os_family'] == 'Alpine'
        else 'rule family=ipv4 source address=' ~ item ~ ' protocol value=vrrp accept'
      }}
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ keepalived_peer_list | default([]) }}"
  when: keepalived_peer_list | default([]) | length > 0
  notify: Restart firewall config

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
  when: not (keepalived_defer_service_restart | default(false) | bool)
