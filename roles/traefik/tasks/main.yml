---
- name: Resolve Traefik socket and proxy facts
  ansible.builtin.include_tasks: facts.yml

- name: Validate Traefik configuration
  ansible.builtin.include_tasks: validate.yml
  when: traefik_enabled | bool

- name: Remove Traefik containers when disabled
  ansible.builtin.include_tasks: teardown.yml
  when: not (traefik_enabled | bool)

- name: Deploy Traefik reverse proxy
  ansible.builtin.include_tasks: deploy.yml
  when: traefik_enabled | bool
