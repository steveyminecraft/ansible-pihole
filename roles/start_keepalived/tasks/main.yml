---
- name: Gather service facts
  ansible.builtin.service_facts:

- name: Select keepalived/keepalive service unit if present
  ansible.builtin.set_fact:
    start_keepalived_service_unit: >-
      {{
        (
          ['keepalived.service', 'keepalive.service', 'keepalived']
          | select('in', ansible_facts.services)
          | list
          | first
        ) | default('')
      }}

- name: Ensure keepalived/keepalive service is started (if present)
  ansible.builtin.service:
    name: "{{ start_keepalived_service_unit | regex_replace('\\.service$', '') }}"
    state: started
  when: start_keepalived_service_unit != ''

- name: Fail when HA resume finds no keepalived unit
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }} has no keepalived or keepalive service unit.
      Refusing to leave this node out of VIP service.
  when:
    - pihole_ha_mode | default(false) | bool
    - start_keepalived_service_unit == ''

- name: Confirm keepalived is active
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - "{{ start_keepalived_service_unit }}"
  register: start_keepalived_active
  changed_when: false
  failed_when: start_keepalived_active.stdout | trim != 'active'
  when:
    - start_keepalived_service_unit != ''
    - ansible_facts['service_mgr'] | default('systemd') != 'openrc'

- name: Confirm keepalived is active (OpenRC)
  ansible.builtin.command:
    argv:
      - rc-service
      - "{{ start_keepalived_service_unit | regex_replace('\\.service$', '') }}"
      - status
  register: start_keepalived_openrc
  changed_when: false
  failed_when: start_keepalived_openrc.rc != 0
  when:
    - start_keepalived_service_unit != ''
    - ansible_facts['service_mgr'] | default('systemd') == 'openrc'
