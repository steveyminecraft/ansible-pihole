---
- name: Prepare keepalived production-variant nodes
  hosts: all
  gather_facts: false
  tasks:
    - name: Ensure ansible remote temp directory exists
      ansible.builtin.file:
        path: /tmp/.ansible-tmp
        state: directory
        mode: "1777"

    - name: Install keepalived, iproute and tcpdump
      ansible.builtin.dnf:
        name:
          - keepalived
          - iproute
          - tcpdump
        state: present
