---
# Production keepalived branch (vagrant_env: false): sync group, IPv6 instance,
# unicast IPv4 VRRP and the rnet priorities, on Rocky 9 (keepalived 2.2.8, as on
# the Pi-holes). Rendered through the same keepalived render.yml that
# update-pihole.yaml uses. The DNS health check is replaced by a flag-file stub
# so VRRP behaviour can be tested without Pi-hole/Unbound containers.
dependency:
  name: shell
  command: ${MOLECULE_PROJECT_DIRECTORY}/scripts/install-ansible-collections.sh
driver:
  name: docker
platforms:
  - name: ka-prod-01
    image: geerlingguy/docker-rockylinux9-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /usr/sbin/init
    tmpfs:
      - /run
      - /tmp
    docker_networks:
      - name: ka-prod-net
        enable_ipv6: true
        ipam_config:
          - subnet: 172.30.7.0/24
          - subnet: fd00:30:7::/64
    networks:
      - name: ka-prod-net
        ipv4_address: 172.30.7.25
        ipv6_address: fd00:30:7::25
  - name: ka-prod-02
    image: geerlingguy/docker-rockylinux9-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /usr/sbin/init
    tmpfs:
      - /run
      - /tmp
    networks:
      - name: ka-prod-net
        ipv4_address: 172.30.7.30
        ipv6_address: fd00:30:7::30
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        ansible_user: root
        pihole_ha_mode: true
        vagrant_env: false
        pihole_vip_ipv4: 172.30.7.35/24
        pihole_vip_ipv6: fd00:30:7::10/64
    host_vars:
      ka-prod-01:
        ansible_docker_host: ka-prod-01
        ansible_host: 172.30.7.25
        priority: 110
        keepalive_role: MASTER
      ka-prod-02:
        ansible_docker_host: ka-prod-02
        ansible_host: 172.30.7.30
        priority: 100
        keepalive_role: BACKUP
  env:
    ANSIBLE_CONFIG: ${MOLECULE_PROJECT_DIRECTORY}/molecule/docker-ci/ansible.cfg
    ANSIBLE_INJECT_FACTS_AS_VARS: "false"
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/roles
    ANSIBLE_COLLECTIONS_PATH: ${MOLECULE_PROJECT_DIRECTORY}/collections:${MOLECULE_PROJECT_DIRECTORY}/.ansible/collections
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  name: keepalived-production
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy
