---
# Every host polls until it holds the IPv4 VIP if and only if it is vip_expected_holder.
- name: Wait for the IPv4 VIP to settle on {{ vip_expected_holder }}
  ansible.builtin.command: ip -o addr show
  register: vip_holder_addrs
  changed_when: false
  retries: "{{ vip_holder_retries | default(30) }}"
  delay: 2
  until: >-
    ((' ' ~ vip4 ~ '/') in vip_holder_addrs.stdout) == (inventory_hostname == vip_expected_holder)
