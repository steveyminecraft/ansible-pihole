---
# Shared Molecule prepare: minimal packages for Ansible + verification (dig, ip).
- name: Prepare instances for Ansible and tests
  hosts: all
  gather_facts: true
  tasks:
    - name: Check whether Ubuntu archive DNS is hijacked to RFC1918
      ansible.builtin.command: getent ahostsv4 us.archive.ubuntu.com
      register: ubuntu_archive_dns
      changed_when: false
      failed_when: false
      when: ansible_facts['distribution'] == 'Ubuntu'

    # Some lab resolvers rewrite archive.ubuntu.com to an internal cache that
    # returns HTTP 503, so apt update hangs. Pin Canonical's public mirrors only
    # in that case (DoH: 91.189.91.81).
    - name: Pin public Ubuntu mirrors when lab DNS hijacks them
      ansible.builtin.blockinfile:
        path: /etc/hosts
        unsafe_writes: true
        marker: "# {mark} MOLECULE UBUNTU ARCHIVE"
        block: |
          91.189.91.81 us.archive.ubuntu.com archive.ubuntu.com
          91.189.91.81 security.ubuntu.com
      when:
        - ansible_facts['distribution'] == 'Ubuntu'
        - ubuntu_archive_dns.stdout | default('') is search('172\.(1[6-9]|2[0-9]|3[0-1])\.|10\.|192\.168\.')

    - name: Check whether Debian archive DNS is hijacked to RFC1918
      ansible.builtin.command: getent ahostsv4 deb.debian.org
      register: debian_archive_dns
      changed_when: false
      failed_when: false
      when: ansible_facts['distribution'] in ['Debian', 'Raspbian']

    - name: Pin public Debian mirrors when lab DNS hijacks them
      ansible.builtin.blockinfile:
        path: /etc/hosts
        unsafe_writes: true
        marker: "# {mark} MOLECULE DEBIAN ARCHIVE"
        block: |
          151.101.2.132 deb.debian.org security.debian.org
      when:
        - ansible_facts['distribution'] in ['Debian', 'Raspbian']
        - debian_archive_dns.stdout | default('') is search('172\.(1[6-9]|2[0-9]|3[0-1])\.|10\.|192\.168\.')

    - name: Install Python and DNS tools (Debian/Ubuntu)
      ansible.builtin.apt:
        name:
          - python3
          - python3-apt
          - python3-requests
          - python3-packaging
          - dnsutils
          - iproute2
          - sqlite3
          - curl
          - openssl
        update_cache: true
        state: present
      when: ansible_facts['os_family'] == 'Debian'

    - name: Install Python and DNS tools (RedHat family)
      ansible.builtin.dnf:
        name:
          - python3
          - python3-requests
          - python3-packaging
          - bind-utils
          - iproute
          - sqlite
          - curl
          - openssl
        state: present
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Stop PackageKit and DNF makecache (RedHat family)
      ansible.builtin.service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - packagekit
        - dnf-makecache.timer
        - dnf-makecache.service
      failed_when: false
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Install Python and DNS tools (Alpine)
      community.general.apk:
        name:
          - python3
          - py3-requests
          - py3-packaging
          - bind-tools
          - iproute2
          - sqlite
          - curl
          - openssl
          - bash
        update_cache: true
        state: present
      when: ansible_facts['os_family'] == 'Alpine'

    # boxomatic/alpine-3.24 20260930.0.1 ships 3.24.2. No Vagrant Cloud box
    # publishes 3.24.3, so move the guest to that patch on the v3.24 repos
    # before the release assert. The Vagrant shell provisioner stays python3-only.
    - name: Upgrade Alpine to the 3.24.3 patch release
      community.general.apk:
        upgrade: true
        update_cache: true
      when: ansible_facts['os_family'] == 'Alpine'

    # apk upgrade installs linux-virt but the box keeps the previous kernel
    # until reboot. firewalld 2.4's nftables then fails with
    # "Protocol not supported" and the daemon exits.
    - name: Reboot Alpine onto the upgraded kernel
      ansible.builtin.reboot:
        reboot_timeout: 600
      when: ansible_facts['os_family'] == 'Alpine'

    - name: Read Alpine release
      ansible.builtin.slurp:
        src: /etc/alpine-release
      register: alpine_release_file
      when: ansible_facts['os_family'] == 'Alpine'

    - name: Assert Alpine release is 3.24.3
      ansible.builtin.assert:
        that:
          - (alpine_release_file.content | b64decode | trim) == '3.24.3'
        fail_msg: >-
          Alpine Molecule guests must be 3.24.3 (/etc/alpine-release).
          Found {{ alpine_release_file.content | default('') | b64decode | trim }}.
      when: ansible_facts['os_family'] == 'Alpine'

    - name: Create lab Traefik certificate directory
      ansible.builtin.file:
        path: "{{ traefik_tls_cert_src | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      when:
        - traefik_enabled | default(false) | bool
        - traefik_tls_enabled | default(true) | bool
        - (traefik_tls_mode | default('dns01')) == 'supplied'
        - (traefik_tls_cert_src | default('') | string | length) > 0

    - name: Generate lab Traefik certificate
      vars:
        molecule_traefik_domain: "{{ traefik_domain | default('lab.example.com') }}"
        molecule_traefik_proxy_host: "{{ pihole_proxy_hostname | default('pihole.lab.example.com') }}"
      ansible.builtin.command:
        argv:
          - openssl
          - req
          - -x509
          - -nodes
          - -newkey
          - rsa:2048
          - -keyout
          - "{{ traefik_tls_key_src }}"
          - -out
          - "{{ traefik_tls_cert_src }}"
          - -days
          - "2"
          - -subj
          - "/CN={{ molecule_traefik_domain }}"
          - -addext
          - "subjectAltName=DNS:{{ molecule_traefik_domain }},DNS:*.{{ molecule_traefik_domain }},DNS:{{ molecule_traefik_proxy_host }}"
        creates: "{{ traefik_tls_cert_src }}"
      when:
        - traefik_enabled | default(false) | bool
        - traefik_tls_enabled | default(true) | bool
        - (traefik_tls_mode | default('dns01')) == 'supplied'
        - (traefik_tls_cert_src | default('') | string | length) > 0
        - (traefik_tls_key_src | default('') | string | length) > 0
