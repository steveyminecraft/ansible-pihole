---
- name: Stat Pi-hole dnsmasq.d directory
  ansible.builtin.stat:
    path: "{{ pihole_dir_loc | default('/opt/pihole') }}/etc/dnsmasq.d"
  register: molecule_dnsmasq_d

- name: Assert dnsmasq.d is traversable by FTL
  ansible.builtin.assert:
    that:
      - molecule_dnsmasq_d.stat.exists | default(false)
      - molecule_dnsmasq_d.stat.isdir | default(false)
      - (molecule_dnsmasq_d.stat.mode | default('')) == '0755'
    fail_msg: >-
      {{ pihole_dir_loc | default('/opt/pihole') }}/etc/dnsmasq.d must be mode
      0755 so FTL UID 1000 can read it. Found
      {{ molecule_dnsmasq_d.stat.mode | default('missing') }}.

- name: Resolve via local Pi-hole on each node
  ansible.builtin.command:
    argv:
      - dig
      - +short
      - +time=2
      - +tries=2
      - "@127.0.0.1"
      - "{{ molecule_dns_verify_qname }}"
  register: dns_local
  changed_when: false
  retries: 15
  delay: 2
  until: >
    (dns_local.stdout_lines | default([])
     | select('match', '^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$')
     | list | length) > 0
  failed_when: >
    (dns_local.stdout_lines | default([])
     | select('match', '^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$')
     | list | length) == 0

- name: Assert local DNS returned IPv4
  ansible.builtin.assert:
    that:
      - dns_local.stdout_lines
        | select('match', '^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$')
        | list
        | length > 0
    fail_msg: >-
      Local DNS did not return an IPv4.
      dig stdout={{ dns_local.stdout | default('') | trim | truncate(200) }}
      rc={{ dns_local.rc | default('n/a') }}

- name: Resolve via VIP (run once on first host)
  ansible.builtin.command:
    argv:
      - dig
      - +short
      - "@{{ vip_address }}"
      - "{{ molecule_dns_verify_qname }}"
  register: dns_vip
  changed_when: false
  failed_when: dns_vip.stdout == ""
  run_once: true

- name: Assert VIP DNS returned IPv4
  ansible.builtin.assert:
    that:
      - dns_vip.stdout_lines
        | select('match', '^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$')
        | list
        | length > 0
    fail_msg: "VIP DNS did not return a valid IPv4."
  run_once: true

# --- Nebula Sync (controller host only) ---
