---
- name: Check firewalld status
  ansible.builtin.command: firewall-cmd --state
  register: firewalld_status
  changed_when: false
  when: pihole_firewall_deploy | default(false) | bool

- name: Assert firewalld is running
  ansible.builtin.assert:
    that:
      - firewalld_status.stdout == "running"
    fail_msg: "Firewall service is not running."
  when: pihole_firewall_deploy | default(false) | bool

- name: Retrieve open firewall ports
  ansible.builtin.command: firewall-cmd --list-ports
  register: open_ports
  changed_when: false
  when: pihole_firewall_deploy | default(false) | bool

- name: Compute expected web ports for firewall assert
  ansible.builtin.set_fact:
    molecule_expected_http_port: >-
      {{ (traefik_http_port | default(80))
         if (traefik_enabled | default(false) | bool)
         else pihole_webport_http }}
    molecule_expected_https_port: >-
      {{ (traefik_https_port | default(443))
         if (traefik_enabled | default(false) | bool)
         else pihole_webport_https }}
  when: pihole_firewall_deploy | default(false) | bool

- name: Assert required ports are open in firewalld
  ansible.builtin.assert:
    that:
      - "'53/tcp' in open_ports.stdout"
      - "'53/udp' in open_ports.stdout"
      - (molecule_expected_http_port | string ~ '/tcp') in open_ports.stdout
      - (molecule_expected_https_port | string ~ '/tcp') in open_ports.stdout
    fail_msg: "Firewall missing required ports."
  when: pihole_firewall_deploy | default(false) | bool

